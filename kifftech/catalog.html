<!doctype html>

<title>KiffTech — Catalogue</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}@media (max-width:360px){html{font-size:14px}}@media (min-width:768px){html{font-size:18px}}@media (min-width:1200px){html{font-size:20px}}
body{min-height:100vh;min-height:100dvh;background:#070816;color:#f4f6ff;font:1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:50;padding:max(clamp(12px,3vh,20px),env(safe-area-inset-top)) clamp(12px,3vw,20px) clamp(12px,3vh,20px);background:rgba(10,12,34,.95);border-bottom:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;flex-shrink:0}
.header-left{display:flex;align-items:center;gap:12px}
.logo{font-size:clamp(28px,5vw,36px)}
h1{font-size:clamp(1.3rem,3.5vw,2rem);font-weight:800;background:linear-gradient(90deg,#1e6bff,#00d4ff,#27d17f);-webkit-background-clip:text;background-clip:text;color:transparent}
.breadcrumb{font-size:clamp(.75rem,1.5vw,.85rem);color:#8a92b8}
.header-right{display:flex;align-items:center;gap:10px}
.cart-btn{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#ffd23f;cursor:pointer;transition:all .2s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cart-btn:hover{border-color:#1e6bff;background:rgba(30,107,255,.15);transform:scale(1.05)}
#cart-count{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;background:linear-gradient(135deg,#1e6bff,#ff3d9a);color:#fff;font-size:.6rem;font-weight:700;border-radius:999px;padding:0 5px;display:flex;align-items:center;justify-content:center;display:none}
main{flex:1;width:100%;max-width:1400px;margin:0 auto;padding:clamp(16px,3vw,24px);padding-left:max(clamp(16px,3vw,24px),env(safe-area-inset-left));padding-right:max(clamp(16px,3vw,24px),env(safe-area-inset-right));padding-bottom:max(clamp(16px,3vw,24px),env(safe-area-inset-bottom));display:grid;gap:clamp(16px,2.5vw,20px);grid-template-columns:1fr}
@media (min-width:900px){main{grid-template-columns:280px 1fr}}
.sidebar{display:flex;flex-direction:column;gap:clamp(16px,2.5vw,20px);height:fit-content;position:sticky;top:calc(100px + 2vh);max-height:calc(100vh - 120px);overflow-y:auto}
.panel{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:clamp(16px,3vw,20px);transition:border-color .2s,box-shadow .2s}
.panel:hover{border-color:rgba(30,107,255,.3);box-shadow:0 8px 30px rgba(30,107,255,.1)}
.panel-title{display:flex;align-items:center;gap:10px;font-size:clamp(.9rem,2vw,1.1rem);font-weight:700;color:#ffd23f;margin-bottom:clamp(12px,2vw,16px)}
.panel-title svg{width:22px;height:22px;color:#1e6bff}
.search-box{display:flex;flex-direction:column;gap:10px}
.search-input-wrap{position:relative}
.search-input{width:100%;padding:14px 16px 14px 44px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;font-size:clamp(.9rem,2vw,1rem);transition:border-color .2s,box-shadow .2s}
.search-input:focus{outline:none;border-color:#1e6bff;box-shadow:0 0 0 3px rgba(30,107,255,.2)}
.search-input::placeholder{color:rgba(255,255,255,.4)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:rgba(255,255,255,.5);pointer-events:none}
.filter-row{display:flex;flex-direction:column;gap:10px}
.filter-group{display:flex;flex-direction:column;gap:6px}
.filter-label{font-size:.7rem;color:#8a92b8;text-transform:uppercase;letter-spacing:.05em}
.filter-btn{padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#b9c0e6;font-size:clamp(.7rem,1.5vw,.8rem);font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;text-align:left}
.filter-btn:hover{border-color:#1e6bff;background:rgba(30,107,255,.15);color:#8ab4ff}
.filter-btn.active{background:linear-gradient(135deg,#1e6bff,#00d4ff);border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(30,107,255,.4)}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px;text-align:center}
.stat-value{font-size:clamp(1.3rem,3vw,1.8rem);font-weight:800;color:#ffd23f;line-height:1}
.stat-label{font-size:clamp(.65rem,1.4vw,.75rem);color:#8a92b8;margin-top:4px}
.products-section{display:flex;flex-direction:column;gap:clamp(16px,2.5vw,20px)}
.section-header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.section-title{font-size:clamp(1.1rem,2.5vw,1.4rem);font-weight:700;background:linear-gradient(90deg,#fff,#b9c0e6);-webkit-background-clip:text;background-clip:text;color:transparent}
.results-count{font-size:clamp(.8rem,1.8vw,.9rem);color:#8a92b8}
.products-grid{display:grid;gap:clamp(16px,2vw,20px);grid-template-columns:1fr}
@media (min-width:600px){.products-grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:900px){.products-grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1200px){.products-grid{grid-template-columns:repeat(4,1fr)}}
.product-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s;display:flex;flex-direction:column;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.product-card:hover{transform:translateY(-6px);border-color:rgba(30,107,255,.4);box-shadow:0 20px 50px rgba(30,107,255,.2)}
.product-media{position:relative;aspect-ratio:1;overflow:hidden;background:rgba(255,255,255,.02)}
.product-media img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.product-card:hover .product-media img{transform:scale(1.05)}
.media-badge{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.badge{font-size:.6rem;padding:4px 8px;border-radius:999px;font-weight:700;letter-spacing:.02em}
.badge-official{background:rgba(30,107,255,.2);color:#8ab4ff}
.badge-promo{background:linear-gradient(135deg,#ff3d9a,#ffd23f);color:#070816;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 4px rgba(255,61,154,.5)}50%{box-shadow:0 0 12px rgba(255,210,63,.8)}}
.product-info{padding:clamp(14px,3vw,20px);display:flex;flex-direction:column;gap:8px;flex:1}
.product-brand{font-size:.7rem;color:#1e6bff;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.product-name{font-size:clamp(.95rem,2vw,1.1rem);font-weight:700;line-height:1.2;margin:0}
.product-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.meta-year{font-size:.7rem;color:#8a92b8;background:rgba(255,255,255,.06);padding:4px 10px;border-radius:999px}
.meta-price-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.price-crossed{font-size:.8rem;color:#8a92b8;text-decoration:line-through}
.price-kifftech{font-size:clamp(1rem,2.5vw,1.3rem);font-weight:800;color:#27d17f}
.price-kifftech.has-discount{color:#ffd23f}
.discount-badge{font-size:.65rem;color:#27d17f;background:rgba(39,209,127,.1);padding:6px 10px;border-radius:999px;display:inline-block;width:fit-content}
.product-specs{display:flex;flex-wrap:wrap;gap:8px;font-size:.7rem;color:#8a92b8}
.spec-row{background:rgba(255,255,255,.04);padding:4px 10px;border-radius:999px}
.spec-label{color:#b9c0e6}
.spec-value{color:#ffd23f;font-weight:600;margin-left:6px}
.product-actions{display:flex;gap:8px;padding:0 clamp(14px,3vw,20px) clamp(14px,3vw,20px);margin-top:auto}
.btn-sm{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:999px;font-size:.75rem;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;touch-action:manipulation}
.btn-sm.primary{background:linear-gradient(135deg,#1e6bff,#00d4ff);border:none;color:#fff}
.btn-sm.primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(30,107,255,.4)}
.btn-sm.secondary{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#b9c0e6}
.btn-sm.secondary:hover{border-color:#1e6bff;background:rgba(30,107,255,.15);color:#8ab4ff}
.empty-state{grid-column:1/-1;padding:60px 20px;text-align:center;color:#8a92b8}
.empty-state svg{font-size:64px;margin-bottom:16px;display:block;margin:0 auto 16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);padding:14px 24px;border-radius:12px;font-weight:600;font-size:.9rem;z-index:1000;opacity:0;transition:all .3s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.toast.visible{transform:translateX(-50%) translateY(0);opacity:1}
.toast.info{background:rgba(30,107,255,.9);color:#fff;border:1px solid rgba(30,107,255,.3)}
.toast.success{background:rgba(39,209,127,.9);color:#070816;border:1px solid rgba(39,209,127,.3)}
.toast.warning{background:rgba(255,210,63,.9);color:#070816;border:1px solid rgba(255,210,63,.3)}
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.8);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:all .3s;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-overlay.visible{opacity:1;visibility:visible}
.modal{background:rgba(10,12,34,.98);border:1px solid rgba(255,255,255,.1);border-radius:20px;max-width:560px;width:100%;max-height:90vh;overflow:hidden;transform:scale(.95);transition:transform .3s}
.modal-overlay.visible .modal{transform:scale(1)}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;padding:clamp(16px,3vw,24px);border-bottom:1px solid rgba(255,255,255,.08)}
.modal-brand{font-size:.7rem;color:#1e6bff;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.modal-name{font-size:clamp(1.1rem,3vw,1.4rem);font-weight:800;margin-top:4px}
.modal-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.meta-promo{font-size:.65rem;padding:4px 10px;border-radius:999px;background:linear-gradient(135deg,#ff3d9a,#ffd23f);color:#070816;font-weight:700}
.modal-close{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#ffd23f;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.modal-close:hover{background:rgba(255,61,154,.3);border-color:#ff3d9a;transform:scale(1.05)}
.modal-body{padding:clamp(16px,3vw,24px);overflow-y:auto;max-height:60vh}
.modal-desc{color:#b9c0e6;line-height:1.6;margin-bottom:clamp(16px,2vw,20px)}
.modal-specs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:clamp(16px,2vw,20px)}
.spec-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px}
.spec-label{font-size:.65rem;color:#8a92b8;text-transform:uppercase;letter-spacing:.05em}
.spec-value{font-size:.85rem;color:#ffd23f;font-weight:600;margin-top:4px}
.modal-prices{display:flex;flex-direction:column;gap:12px}
.price-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px;transition:border-color .2s}
.price-card.primary{border-color:#27d17f;background:rgba(39,209,127,.05)}
.price-source{display:flex;align-items:center;gap:8px;font-size:.7rem;color:#8a92b8;margin-bottom:8px}
.discount-tag{font-size:.6rem;padding:2px 8px;border-radius:999px;background:linear-gradient(135deg,#ff3d9a,#ffd23f);color:#070816;font-weight:700}
.price-value{font-size:clamp(1.3rem,3.5vw,1.8rem);font-weight:800;color:#fff}
.price-card.primary .price-value{color:#27d17f}
.price-link{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,#1e6bff,#00d4ff);color:#fff;font-weight:700;font-size:.8rem;text-decoration:none;transition:transform .15s}
.price-link:hover{transform:translateY(-2px)}
.modal-media{position:relative;aspect-ratio:1;background:rgba(255,255,255,.02);border-radius:12px;overflow:hidden;margin-bottom:12px}
.modal-media img{width:100%;height:100%;object-fit:cover}
.media-nav{display:flex;justify-content:center;gap:8px}
.media-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2);border:none;cursor:pointer;transition:all .15s}
.media-dot.active{background:#ffd23f;transform:scale(1.3);box-shadow:0 0 12px rgba(255,210,63,.6)}
@media (prefers-color-scheme:light){:root{color-scheme:dark}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="header-left">
    <span class="logo">📱</span>
    <h1>KiffTech</h1>
  </div>
  <div class="header-right">
    <button class="cart-btn" id="btn-cart-header" aria-label="Panier">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      <span id="cart-count">0</span>
    </button>
    <a href="./rayons.html" style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;border:1px solid rgba(30,107,255,.4);background:rgba(30,107,255,.12);color:#8ab4ff;font-weight:700;font-size:clamp(.75rem,1.6vw,.85rem);text-decoration:none;white-space:nowrap">
      Rayons
    </a>
    <a href="../" style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#ffd23f;font-weight:700;font-size:clamp(.75rem,1.6vw,.85rem);text-decoration:none;transition:all .2s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);white-space:nowrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Cube
    </a>
  </div>
</header>
<main>
  <aside class="sidebar">
    <div class="panel search-box">
      <div class="panel-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>Recherche</div>
      <div class="search-input-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" class="search-input" id="search-input" placeholder="Marque, modèle, catégorie..." aria-label="Rechercher">
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">🤖 Agent IA — Référence exacte</div>
      <div class="search-input-wrap">
        <input type="search" class="search-input" id="agent-input" placeholder="Marque + modèle exacts…" aria-label="Agent IA : marque et modèle exacts" style="padding-left:16px">
      </div>
      <button class="btn-sm primary" id="agent-btn" style="margin-top:10px;width:100%;padding:12px">Identifier + Aperçu</button>
      <div id="agent-result" style="margin-top:10px;display:grid;gap:8px" aria-live="polite"></div>
    </div>
    <div class="panel">
      <div class="panel-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Filtres</div>
      <div class="filter-row">
        <div class="filter-group">
          <span class="filter-label">Catégorie</span>
          <div id="filter-category" class="filter-row" style="flex-direction:column"></div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Année</span>
          <div id="filter-year" class="filter-row" style="flex-direction:column"></div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Marque</span>
          <div id="filter-brand" class="filter-row" style="flex-direction:column"></div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Époque (Consoles)</span>
          <div id="filter-era" class="filter-row" style="flex-direction:column"></div>
        </div>
      </div>
    </div>
    <div class="panel stats-grid">
      <div class="stat-card"><div class="stat-value" id="stat-products">0</div><div class="stat-label">Produits</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-sources">-</div><div class="stat-label">Sources</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-coverage">-</div><div class="stat-label">Années</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-updated">-</div><div class="stat-label">MAJ</div></div>
    </div>
  </aside>
  <section class="products-section">
    <div class="section-header">
      <h2 class="section-title">Catalogue</h2>

        <option value="relevance">Pertinence</option>
        <option value="brand">Marque A-Z</option>
        <option value="price-asc">Prix croissant</option>
        <option value="price-desc">Prix décroissant</option>
      </select>
    </div>
    <div class="products-grid" id="products-grid" role="list"></div>
  </section>
</main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-name">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-brand" id="modal-brand"></div>
        <h2 class="modal-name" id="modal-name"></h2>
        <div class="modal-meta" id="modal-meta"></div>
      </div>
      <button class="modal-close" id="modal-close" aria-label="Fermer">×</button>
    </div>
    <div class="modal-body">
      <p class="modal-desc" id="modal-desc"></p>
      <div class="modal-specs" id="modal-specs"></div>
      <div class="modal-prices" id="modal-prices"></div>
      <div class="modal-media" id="modal-media"></div>
      <div class="media-nav" id="media-nav"></div>
    </div>
  </div>
</div>

<script>
console.log('[Catalog] Inline script executed');
if ('serviceWorker' in navigator) {
  let refreshing = false;
  const forceReload = () => { if (refreshing) return; refreshing = true; window.location.reload(); };
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!sessionStorage.getItem('sw-fresh')) { sessionStorage.setItem('sw-fresh', '1'); return; }
    forceReload();
  });
  navigator.serviceWorker.register('./sw.js').then(reg => {
    console.log('[SW] Registered:', reg.scope);
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', () => { if (nw.state === 'activated') forceReload(); });
    });
    if (reg.waiting) forceReload();
  }).catch(err => console.warn('[SW] Registration failed:', err));
  sessionStorage.setItem('sw-fresh', '1');
}
setTimeout(() => {
  const grid = document.getElementById('products-grid');
  console.log('[Catalog] products-grid children:', grid?.children?.length || 0);
  console.log('[Catalog] products-grid innerHTML length:', grid?.innerHTML?.length || 0);
}, 1000);
</script>
<script src="../refresh.js"></script>
