name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify site files
        run: |
          test -f index.html || (echo "index.html manquant" && exit 1)
          node --check app.js
          node tests/run.js
          if [ -f kifftech/impact-products.json ]; then
            node -e "const d=require('./kifftech/impact-products.json');if(!Array.isArray(d.products)||!d.products.length)throw new Error('vide');console.log('impact-products.json OK:',d.products.length,'produits');"
          else
            echo "impact-products.json absent : catalogue local uniquement (normal avant la 1re synchro)."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
