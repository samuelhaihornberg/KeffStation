  constructor() {
    this.apps = APPS;
    this.current = 0;
    this.subCurrent = 0;
    this.startX = 0;
    this.startY = 0;
    this.currentAngle = 0;
    this.isDragging = false;
    this.deferredPrompt = null;

    this.prisme = document.getElementById('prisme');
    this.nav = document.getElementById('nav');
    this.gesture = document.getElementById('gesture');
    this.arrows = document.getElementById('arrows');
    this.installBtn = document.getElementById('installBtn');
    this.vitrineMain = document.getElementById('vitrineMain');
    this.vitrineDiag = document.getElementById('vitrineDiag');

    const missing = ['prisme','nav','gesture','arrows','vitrineMain','vitrineDiag'].filter(id => !document.getElementById(id));
    if (missing.length) throw new Error('Missing DOM elements: ' + missing.join(', '));

    this.faces = null;
    this.setupInstallPrompt();
  }

  setupInstallPrompt() {
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      this.deferredPrompt = e;
      this.installBtn?.classList.add('show');
    });
    window.addEventListener('appinstalled', () => {
      this.deferredPrompt = null;
      this.installBtn?.classList.remove('show');
    });
    this.installBtn?.addEventListener('click', async () => {
      if (!this.deferredPrompt) return;
      this.deferredPrompt.prompt();
      const { outcome } = await this.deferredPrompt.userChoice;
      if (outcome === 'accepted') this.installBtn.classList.remove('show');
      this.deferredPrompt = null;
    });
  }

  init() {
    this.buildUI();
    this.setupEventListeners();
    this.initParticles();
    this.registerSW();
    console.log('KeffStation initialized');
  }

  buildUI() {
    this.apps.forEach((app, i) => {
      const face = document.createElement('div');
      face.className = 'face' + (i === 0 ? ' active' : '');
      face.dataset.index = i;
      const sub = app.subArticles[0];
      face.innerHTML = `
        <div class="face-content">
          <div class="num">${sanitizeHTML(app.num)}</div>
          <h2><a href="${sanitizeHTML(app.appUrl)}" target="_blank" rel="noopener noreferrer" class="app-link">${sanitizeHTML(app.title)}</a></h2>
          <p>${sanitizeHTML(app.desc)}</p>
          <div class="sub-article">
            <h3>${sanitizeHTML(sub.title)}</h3>
            <p>${sanitizeHTML(sub.desc)}</p>
            <div class="tags">${sub.tags.map(t => `<span class="tag">${sanitizeHTML(t)}</span>`).join('')}</div>
          </div>
          <div class="sub-nav"><span class="sub-indicator">1/${app.subArticles.length}</span></div>
          <div class="tags">${app.tags.map(t => `<span class="tag">${sanitizeHTML(t)}</span>`).join('')}</div>
        </div>
      `;
      this.prisme.appendChild(face);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = app.num;
      btn.setAttribute('aria-label', app.num);
      if (i === 0) btn.classList.add('active');
      btn.addEventListener('click', () => this.goTo(i));
      this.nav.appendChild(btn);
    });
    this.faces = this.prisme.children;
    this.renderSubArticle();
  }

  setupEventListeners() {
    // ===== NAV BUTTONS (PWA) =====
    Array.from(this.nav.children).forEach((btn, i) => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); this.goTo(i); }, { passive: false });
      btn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.goTo(i); }
      });
    });

    // ===== ARROW BUTTONS (Article navigation) =====
    const arrowMap = {
      'arrow-left': () => this.goTo(this.current - 1),
      'arrow-right': () => this.goTo(this.current + 1),
      'arrow-up': () => this.goSub(-1),
      'arrow-down': () => this.goSub(1)
    };
    Object.entries(arrowMap).forEach(([cls, fn]) => {
      const btn = this.arrows.querySelector(`.${cls}`);
      if (btn) {
        btn.addEventListener('click', (e) => { e.stopPropagation(); e.preventDefault(); fn(); }, { passive: false });
        btn.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); }
        });
        // Pointer/touch for better touch support
        btn.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); }, { passive: false });
      }
    });

    // ===== KEYBOARD (Global) =====
    document.addEventListener('keydown', (e) => {
      // Ignore if typing in input
      if (e.target.isContentEditable || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      
      const keyMap = {
        'ArrowLeft': () => this.goTo(this.current - 1),
        'ArrowRight': () => this.goTo(this.current + 1),
        'ArrowUp': () => this.goSub(-1),
        'ArrowDown': () => this.goSub(1),
        'Home': () => this.goTo(0),
        'End': () => this.goTo(this.faces.length - 1),
        'PageUp': () => this.goTo((this.current - 1 + this.faces.length) % this.faces.length),
        'PageDown': () => this.goTo((this.current + 1) % this.faces.length),
        ' ': () => { e.preventDefault(); this.goTo((this.current + 1) % this.faces.length); }, // Space = next PWA
        'Enter': () => { e.preventDefault(); this.goSub(1); } // Enter = next article
      };
      if (keyMap[e.key]) { e.preventDefault(); keyMap[e.key](); }
    }, { passive: false });

    // ===== MOUSE WHEEL (Horizontal = PWA, Vertical = Article) =====
    this.gesture.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
        this.goTo(this.current + (e.deltaX > 0 ? 1 : -1));
      } else {
        this.goSub(e.deltaY > 0 ? 1 : -1);
      }
    }, { passive: false });

    // ===== POINTER EVENTS (Unified mouse/touch/pen) =====
    this.gesture.addEventListener('pointerdown', (e) => this.onDragStart(e), { passive: false });
    this.gesture.addEventListener('pointermove', (e) => this.onDragMove(e), { passive: false });
    this.gesture.addEventListener('pointerup', (e) => this.onDragEnd(e), { passive: false });
    this.gesture.addEventListener('pointercancel', () => this.onDragEnd(null), { passive: false });
    this.gesture.addEventListener('pointerleave', () => this.onDragEnd(null), { passive: false });

    // ===== TOUCH EVENTS (Explicit for iOS Safari) =====
    this.gesture.addEventListener('touchstart', (e) => this.onDragStart(e), { passive: true });
    this.gesture.addEventListener('touchmove', (e) => this.onDragMove(e), { passive: false });
    this.gesture.addEventListener('touchend', (e) => this.onDragEnd(e), { passive: true });
    this.gesture.addEventListener('touchcancel', () => this.onDragEnd(null), { passive: true });

    // ===== GAMEPAD / JOYSTICK =====
    this.setupGamepad();

    // ===== CONTEXT MENU PREVENTION =====
    this.gesture.addEventListener('contextmenu', (e) => e.preventDefault(), { passive: false });

    // ===== DRAG PREVENTION ON UI ELEMENTS =====
    ['nav', 'arrows', 'installBtn'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('pointerdown', (e) => e.stopPropagation(), { passive: true });
    });
  }

  setupGamepad() {
    let lastPoll = 0;
    const deadzone = 0.3;
    const pollGamepad = () => {
      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      const gp = gamepads[0];
      if (!gp) { requestAnimationFrame(pollGamepad); return; }
      
      const now = performance.now();
      if (now - lastPoll < 100) { requestAnimationFrame(pollGamepad); return; }
      
      // Left stick / D-pad horizontal = PWA nav
      const hAxis = gp.axes[0]; // Left stick X
      const hBtn = gp.buttons[14].pressed || gp.buttons[15].pressed; // D-pad left/right
      if (Math.abs(hAxis) > deadzone || hBtn) {
        if ((hAxis > deadzone || gp.buttons[15].pressed) && !this._gpHorizLock) {
          this.goTo(this.current + 1); this._gpHorizLock = true;
        } else if ((hAxis < -deadzone || gp.buttons[14].pressed) && !this._gpHorizLock) {
          this.goTo(this.current - 1); this._gpHorizLock = true;
        } else if (Math.abs(hAxis) <= deadzone && !hBtn) {
          this._gpHorizLock = false;
        }
      }
      
      // Left stick / D-pad vertical = Article nav
      const vAxis = gp.axes[1]; // Left stick Y
      const vBtn = gp.buttons[12].pressed || gp.buttons[13].pressed; // D-pad up/down
      if (Math.abs(vAxis) > deadzone || vBtn) {
        if ((vAxis > deadzone || gp.buttons[13].pressed) && !this._gpVertLock) {
          this.goSub(1); this._gpVertLock = true;
        } else if ((vAxis < -deadzone || gp.buttons[12].pressed) && !this._gpVertLock) {
          this.goSub(-1); this._gpVertLock = true;
        } else if (Math.abs(vAxis) <= deadzone && !vBtn) {
          this._gpVertLock = false;
        }
      }
      
      // Face buttons: A = next article, B = prev article, X = next PWA, Y = prev PWA
      if (gp.buttons[0].pressed && !this._gpBtnALock) { this.goSub(1); this._gpBtnALock = true; }
      else if (!gp.buttons[0].pressed) this._gpBtnALock = false;
      if (gp.buttons[1].pressed && !this._gpBtnBLock) { this.goSub(-1); this._gpBtnBLock = true; }
      else if (!gp.buttons[1].pressed) this._gpBtnBLock = false;
      if (gp.buttons[2].pressed && !this._gpBtnXLock) { this.goTo(this.current + 1); this._gpBtnXLock = true; }
      else if (!gp.buttons[2].pressed) this._gpBtnXLock = false;
      if (gp.buttons[3].pressed && !this._gpBtnYLock) { this.goTo(this.current - 1); this._gpBtnYLock = true; }
      else if (!gp.buttons[3].pressed) this._gpBtnYLock = false;
      
      // Shoulders: LB = prev PWA, RB = next PWA
      if (gp.buttons[4].pressed && !this._gpBtnLBLock) { this.goTo(this.current - 1); this._gpBtnLBLock = true; }
      else if (!gp.buttons[4].pressed) this._gpBtnLBLock = false;
      if (gp.buttons[5].pressed && !this._gpBtnRBLock) { this.goTo(this.current + 1); this._gpBtnRBLock = true; }
      else if (!gp.buttons[5].pressed) this._gpBtnRBLock = false;
      
      lastPoll = now;
      requestAnimationFrame(pollGamepad);
    };
    if (navigator.getGamepads) {
      window.addEventListener('gamepadconnected', pollGamepad);
      window.addEventListener('gamepaddisconnected', () => {});
      // Start polling if already connected
      if (navigator.getGamepads()[0]) pollGamepad();
    }
  }

  goTo(i, animate = true) {
    if (!this.faces?.length) return;
    if (i < 0) i = this.faces.length - 1;
    if (i >= this.faces.length) i = 0;
    if (i === this.current) return;

    const prev = this.current;
    this.current = i;
    this.subCurrent = 0;
    const angle = -this.current * 120;
    this.prisme.style.transition = animate ? 'transform .8s cubic-bezier(.23,1,.32,1)' : 'none';
    this.prisme.style.transform = `rotateY(${angle}deg)`;

    if (animate && this.vitrineMain && this.vitrineDiag) {
      // Doors open/close with pure rotation around center (no translateX shift)
      this.vitrineMain.style.transition = 'transform .6s cubic-bezier(.23,1,.32,1)';
      this.vitrineDiag.style.transition = 'transform .6s cubic-bezier(.23,1,.32,1) .05s';
      this.vitrineMain.style.transform = 'translate(-50%,-50%) rotateY(-90deg)';
      this.vitrineDiag.style.transform = 'translate(-50%,-50%) rotateY(-90deg) rotateZ(20deg)';
      
      setTimeout(() => {
        this.vitrineMain.style.transform = 'translate(-50%,-50%) rotateY(0deg)';
        this.vitrineDiag.style.transform = 'translate(-50%,-50%) rotateY(90deg) rotateZ(20deg)';
      }, 600);
    }

    Array.from(this.faces).forEach((f, idx) => f.classList.toggle('active', idx === this.current));

    Array.from(this.nav.children).forEach((d, idx) => d.classList.toggle('active', idx === this.current));
    this.arrows.setAttribute('data-face', this.current);
    this.nav.setAttribute('data-face', this.current);
    this.renderSubArticle();
  }

  goSub(delta) {
    const app = APPS[this.current];
    if (!app) return;
    const max = app.subArticles.length - 1;
    this.subCurrent = Math.max(0, Math.min(max, this.subCurrent + delta));
    
    // Quick vitrine blink for article change
    if (this.vitrineMain && this.vitrineDiag) {
      this.vitrineMain.style.transition = 'transform .2s ease, opacity .2s ease';
      this.vitrineDiag.style.transition = 'transform .2s ease, opacity .2s ease';
      this.vitrineMain.style.opacity = '0.5';
      this.vitrineDiag.style.opacity = '0.35';
      setTimeout(() => {
        this.vitrineMain.style.opacity = '1';
        this.vitrineDiag.style.opacity = '0.7';
      }, 200);
    }
    
    this.renderSubArticle();
  }

  renderSubArticle() {
    const app = APPS[this.current];
    if (!app) return;
    const sub = app.subArticles[this.subCurrent];
    const face = this.faces[this.current];
    if (!face) return;

    const subEl = face.querySelector('.sub-article');
    const indicator = face.querySelector('.sub-indicator');
    if (subEl && sub) {
      subEl.innerHTML = `
        <h3>${sanitizeHTML(sub.title)}</h3>
        <p>${sanitizeHTML(sub.desc)}</p>
        <div class="tags">${sub.tags.map(t => `<span class="tag">${sanitizeHTML(t)}</span>`).join('')}</div>
      `;
    }
    if (indicator) indicator.textContent = `${this.subCurrent + 1}/${app.subArticles.length}`;
  }

  onDragStart(e) {
    this.isDragging = true;
    this.startX = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
    this.startY = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
    this.currentAngle = -this.current * 120;
    this.prisme.style.transition = 'none';
    if (e.target?.setPointerCapture) e.target.setPointerCapture(e.pointerId);
  }

  onDragMove(e) {
    if (!this.isDragging) return;
    const dx = (e.clientX ?? e.touches?.[0]?.clientX ?? 0) - this.startX;
    const dy = (e.clientY ?? e.touches?.[0]?.clientY ?? 0) - this.startY;
    const prismAngle = this.currentAngle + dx * 0.5;
    this.prisme.style.transform = `rotateY(${prismAngle}deg)`;
    
    // Dynamic vitrine doors: open progressively with drag (pure rotation, no translateX shift)
    const dragProgress = Math.min(Math.abs(dx) / 120, 1); // 0 to 1
    if (this.vitrineMain && this.vitrineDiag) {
      this.vitrineMain.style.transition = 'none';
      this.vitrineDiag.style.transition = 'none';
      this.vitrineMain.style.transform = `translate(-50%,-50%) rotateY(${-90 * dragProgress}deg)`;
      this.vitrineDiag.style.transform = `translate(-50%,-50%) rotateY(${-90 * dragProgress}deg) rotateZ(${-20 * dragProgress}deg)`;
    }
    
    this.dragDeltaY = dy;
  }

  onDragEnd(e) {
    if (!this.isDragging) return;
    this.isDragging = false;
    const dx = (e.clientX ?? e.changedTouches?.[0]?.clientX ?? 0) - this.startX;
    const dy = this.dragDeltaY ?? 0;
    const threshold = 24;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (adx > threshold || ady > threshold) {
      if (adx > ady) {
        this.goTo(this.current + (dx > 0 ? -1 : 1));
      } else {
        this.goSub(dy > 0 ? -1 : 1);
      }
    } else {
      this.prisme.style.transition = 'transform .5s cubic-bezier(.23,1,.32,1)';
      this.prisme.style.transform = `rotateY(${this.currentAngle}deg)`;
      
      // Close doors smoothly on spring back (pure rotation, no translateX shift)
      if (this.vitrineMain && this.vitrineDiag) {
        this.vitrineMain.style.transition = 'transform .5s cubic-bezier(.23,1,.32,1)';
        this.vitrineDiag.style.transition = 'transform .5s cubic-bezier(.23,1,.32,1) .05s';
        this.vitrineMain.style.transform = 'translate(-50%,-50%) rotateY(0deg)';
        this.vitrineDiag.style.transform = 'translate(-50%,-50%) rotateY(90deg) rotateZ(20deg)';
      }
    }
    this.dragDeltaY = 0;
    if (e.target?.releasePointerCapture) e.target.releasePointerCapture(e.pointerId);
  }

  initParticles() {
    try {
      const container = document.getElementById('particules');
      if (!container) return;
      const colors = ['#1e6bff','#ff3d9a','#ffd23f','#27d17f','#8a4dff'];
      for (let i = 0; i < 24; i++) {
        const p = document.createElement('div');
        p.className = 'particule';
        const sx = (Math.random() - .5) * window.innerWidth * .8;
        const sy = (Math.random() - .5) * window.innerHeight * .8;
        const ex = (Math.random() - .5) * window.innerWidth * .8;
        const ey = (Math.random() - .5) * window.innerHeight * .8;
        const dur = 12 + Math.random() * 10;
        const delay = Math.random() * 15;
        const clr = colors[Math.floor(Math.random() * colors.length)];
        p.style.cssText = `left:50%;top:50%;--sx:${sx}px;--sy:${sy}px;--ex:${ex}px;--ey:${ey}px;--op:${.1+Math.random()*.2};background:${clr};animation-duration:${dur}s;animation-delay:${delay}s`;
        container.appendChild(p);
      }
    } catch (e) { console.error('initParticles error:', e); }
  }

  registerSW() {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.warn);
    }
  }
}

(function() {
  function runInit() {
    try {
      window.keffStation = new KeffStation();
      window.keffStation.init();
      console.log('KeffStation ready');
    } catch (e) { console.error('KeffStation init error:', e); }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', runInit);
  } else {
    runInit();
  }
})();
</script>
</body>
</html>
