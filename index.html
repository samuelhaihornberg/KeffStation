<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070816">
<title>KeffStation — Lecteur géométrique</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='65' font-size='60' text-anchor='middle'%3E🔮%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#070816;color:#f4f6ff;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* --- Fond atmosphérique --- */
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  #bg::before{
    content:'';position:absolute;inset:0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%,rgba(30,107,255,.08) 0%,transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 90%,rgba(255,61,154,.06) 0%,transparent 50%),
      radial-gradient(ellipse 40% 40% at 50% 50%,rgba(255,210,63,.04) 0%,transparent 70%);
  }

  /* --- Lecteur principal : octogone hybride --- */
  .reader{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    width:min(85vw,520px);aspect-ratio:1;
    z-index:10;display:flex;flex-direction:column;
  }

  /* Octogone hybride : carré + triangles aux coins = 8 côtés */
  .vitrine{
    position:relative;width:100%;height:100%;
    /* Octogone régulier via clip-path */
    clip-path:polygon(
      15% 0, 85% 0,    /* haut: 2 segments */
      100% 15%, 100% 85%,  /* droite */
      85% 100%, 15% 100%,  /* bas */
      0 85%, 0 15%        /* gauche */
    );
    /* Verre translucide : dégradé + bruit + reflets */
    background:
      /* Couche 1: verre de base */
      linear-gradient(135deg,
        rgba(255,255,255,.03) 0%,
        rgba(255,255,255,.015) 40%,
        rgba(10,12,34,.12) 60%,
        rgba(5,5,16,.18) 100%
      ),
      /* Couche 2: reflets diagonaux */
      repeating-linear-gradient(
        45deg,
        rgba(255,255,255,.008) 0px,
        rgba(255,255,255,.008) 1px,
        transparent 1px,
        transparent 24px
      ),
      /* Couche 3: lueur centrale */
      radial-gradient(ellipse 60% 60% at 50% 40%,
        rgba(30,107,255,.06) 0%,
        transparent 70%
      );
    border:1px solid rgba(255,255,255,.12);
    box-shadow:
      /* Ombre portée */
      0 40px 120px -20px rgba(0,0,0,.6),
      /* Lueur interne haute */
      inset 0 1px 0 rgba(255,255,255,.15),
      inset 0 -1px 0 rgba(255,255,255,.03),
      /* Reflets latéraux */
      inset 1px 0 0 rgba(255,255,255,.08),
      inset -1px 0 0 rgba(255,255,255,.02);
    border-radius:0; /* clip-path gère la forme */
    overflow:hidden;
  }

  /* Bordure lumineuse animée (contour octogone) */
  .vitrine::before{
    content:'';position:absolute;inset:-1px;
    clip-path:polygon(
      15% 0, 85% 0, 100% 15%, 100% 85%, 85% 100%, 15% 100%, 0 85%, 0 15%
    );
    background:linear-gradient(90deg,
      transparent 0%,
      rgba(30,107,255,.4) 20%,
      rgba(255,61,154,.4) 50%,
      rgba(255,210,63,.4) 80%,
      transparent 100%
    );
    background-size:300% 100%;
    animation:brillance 6s linear infinite;
    opacity:.6;
    pointer-events:none;
    z-index:1;
  }

  @keyframes brillance{
    0%{background-position:0% 50%}
    100%{background-position:300% 50%}
  }

  /* Reflet "Pepper's ghost" en bas */
  .vitrine::after{
    content:'';position:absolute;bottom:0;left:10%;right:10%;height:35%;
    background:linear-gradient(to top,
      rgba(255,255,255,.04) 0%,
      rgba(255,255,255,.01) 40%,
      transparent 100%
    );
    transform:scaleY(-1);
    opacity:.3;
    pointer-events:none;
    mask-image:linear-gradient(to top,black 0%,transparent 100%);
    -webkit-mask-image:linear-gradient(to top,black 0%,transparent 100%);
  }

  /* --- Contenu rotatif (carrousel interne) --- */
  .carousel{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    perspective:1200px;
  }

  .prisme{
    position:relative;width:80%;height:70%;
    transform-style:preserve-3d;
    transition:transform .7s cubic-bezier(.2,.8,.2,1);
  }
  .prisme.glisse{transition:none}

  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:clamp(16px,4vw,28px);
    text-align:center;
    opacity:0;transform:translateZ(-200px) rotateY(90deg);
    pointer-events:none;
  }
  .face.active{
    opacity:1;transform:translateZ(0) rotateY(0deg);
    pointer-events:auto;
    transition:opacity .35s,transform .35s;
  }
  .face.prev{transform:translateZ(-200px) rotateY(-90deg)}
  .face.next{transform:translateZ(-200px) rotateY(90deg)}

  .face .num{font-size:clamp(.7rem,2.5vw,.85rem);letter-spacing:.15em;text-transform:uppercase;color:#ffd23f;margin-bottom:.5em;opacity:.9}
  .face h2{
    font-size:clamp(1.1rem,3.5vw,1.6rem);margin:0 0 .6em;line-height:1.15;font-weight:700;
    background:linear-gradient(90deg,#1e6bff,#ff3d9a,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .face p{font-size:clamp(.85rem,2.2vw,.95rem);color:#b9c0e6;line-height:1.5;max-width:90%}
  .face .tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:1.2em}
  .face .tag{font-size:clamp(.6rem,1.8vw,.68rem);padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#ffd23f;white-space:nowrap}

  /* --- Roadmap carrée (navigation articles) --- */
  .nav{
    position:absolute;
    bottom:clamp(8px,2vh,16px);
    left:50%;
    transform:translateX(-50%);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:clamp(6px,1.5vw,10px);
    width:clamp(120px,30vw,200px);
    z-index:5;
    padding:clamp(6px,1.5vh,10px);
    background:rgba(10,12,34,.6);
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;
    backdrop-filter:blur(8px);
  }
  .nav button{
    width:100%;aspect-ratio:1;
    border-radius:6px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.05);
    color:#b9c0e6;
    font-size:clamp(.6rem,1.5vw,.75rem);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.08em;
    cursor:pointer;
    transition:transform .15s,background .15s,border-color .15s,color .15s,box-shadow .15s;
    display:flex;align-items:center;justify-content:center;
  }
  .nav button:hover{
    background:rgba(30,107,255,.2);
    border-color:#1e6bff;
    color:#ffd23f;
  }
  .nav button.active{
    background:#ffd23f;
    border-color:#ffd23f;
    color:#070816;
    box-shadow:0 0 16px rgba(255,210,63,.6),inset 0 0 0 1px rgba(255,210,63,.3);
    transform:scale(1.05);
  }
  .nav button:focus-visible{outline:2px solid #ffd23f;outline-offset:2px}

  /* --- Flèches de navigation (4 directions) --- */
  .arrows{position:absolute;inset:0;z-index:4;pointer-events:none}
  .arrows button{
    pointer-events:auto;
    position:absolute;
    width:clamp(40px,6vw,56px);height:clamp(40px,6vw,56px);
    border-radius:50%;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(10,12,34,.7);
    color:#ffd23f;
    font-size:clamp(18px,3vw,24px);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .15s,background .15s,border-color .15s,box-shadow .15s;
    backdrop-filter:blur(8px);
    box-shadow:0 4px 20px rgba(0,0,0,.4);
  }
  .arrows button:hover{background:rgba(30,107,255,.3);border-color:#1e6bff;transform:scale(1.1);box-shadow:0 0 20px rgba(30,107,255,.4)}
  .arrows button:active{transform:scale(.95)}
  .arrows button:focus-visible{outline:2px solid #ffd23f;outline-offset:2px}
  .arrow-up{top:clamp(8px,2vh,16px);left:50%;transform:translateX(-50%)}
  .arrow-down{bottom:clamp(8px,2vh,16px);left:50%;transform:translateX(-50%)}
  .arrow-left{left:clamp(8px,2vw,16px);top:50%;transform:translateY(-50%)}
  .arrow-right{right:clamp(8px,2vw,16px);top:50%;transform:translateY(-50%)}

  /* --- Gestes tactiles zone --- */
  .gesture-zone{position:absolute;inset:0;z-index:3;touch-action:none}

  /* --- Particules atmosphériques --- */
  .particules{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .particule{position:absolute;width:3px;height:3px;border-radius:50%;opacity:0;animation:float 12s ease-in-out infinite}
  @keyframes float{
    0%{transform:translate(var(--sx),var(--sy)) scale(0);opacity:0}
    10%{opacity:var(--op)}
    90%{opacity:var(--op)}
    100%{transform:translate(var(--ex),var(--ey)) scale(1);opacity:0}
  }
</style>
</head>
<body>
<div id="bg"></div>
<div class="particules" id="particules"></div>

<div class="reader" role="region" aria-roledescription="lecteur d'applications" aria-label="Kifftech, Tricktrocjob, ViArtificial labs">
  <div class="vitrine">
    <div class="carousel" id="carousel">
      <div class="prisme" id="prisme"></div>
    </div>
    <nav class="nav" id="nav" aria-label="Navigation applications"></nav>
    <div class="gesture-zone" id="gesture"></div>
    <div class="arrows" id="arrows" aria-label="Navigation directionnelle">
      <button class="arrow-up" type="button" aria-label="Article précédent" title="Précédent">▲</button>
      <button class="arrow-down" type="button" aria-label="Article suivant" title="Suivant">▼</button>
      <button class="arrow-left" type="button" aria-label="Article précédent" title="Précédent">◀</button>
      <button class="arrow-right" type="button" aria-label="Article suivant" title="Suivant">▶</button>
    </div>
  </div>
</div>

<script>
(() => {
  const apps = [
    {
      num: "Kifftech",
      title: "Smart devices & gadgets",
      desc: "Boutique PWA : Samsung, Xiaomi, prix sous officiels, livraison mondiale. Backend Node unique, zéro dépendance, données JSON.",
      tags: ["PWA", "Node", "E-commerce", "Smart tech"]
    },
    {
      num: "Tricktrocjob",
      title: "Plateforme Trix / Trox / Services",
      desc: "Échange d'astuces pas à pas, troc d'objets, services entre particuliers. Frais dégressifs 17%→5%, double porte-monnaie (solde + crédits).",
      tags: ["Marketplace", "Troc", "Crédits", "Communauté"]
    },
    {
      num: "ViArtificial labs",
      title: "cos, SuperBots, BLM, BLSM",
      desc: "Syntaxe cos (connexions), famille SuperBots (ViA, BTB+Golem, Geeko, Guideoplan), blocs logiques BLM/BLSM, motor.s injection.",
      tags: ["cos", "SuperBots", "BLM", "motor.s"]
    }
  ];

  const prisme = document.getElementById('prisme');
  const nav = document.getElementById('nav');
  const gesture = document.getElementById('gesture');

  let current = 0;
  let startX = 0, currentAngle = 0;
  let isDragging = false;

  // Construire les faces du prisme
  apps.forEach((app, i) => {
    const face = document.createElement('div');
    face.className = 'face' + (i === 0 ? ' active' : '');
    face.dataset.index = i;
    face.innerHTML = `
      <div class="num">${app.num}</div>
      <h2>${app.title}</h2>
      <p>${app.desc}</p>
      <div class="tags">${app.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    `;
    prisme.appendChild(face);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = app.num;
    btn.setAttribute('aria-label', `${app.num}`);
    if (i === 0) btn.classList.add('active');
    btn.addEventListener('click', () => goTo(i));
    nav.appendChild(btn);
  });

  const faces = prisme.children;
  const dots = nav.children;

  function goTo(i, animate = true) {
    if (i < 0) i = faces.length - 1;
    if (i >= faces.length) i = 0;
    if (i === current) return;

    const prev = current;
    current = i;

    // Rotation 3D du prisme
    const angle = -current * (360 / faces.length);
    prisme.style.transition = animate ? 'transform .7s cubic-bezier(.2,.8,.2,1)' : 'none';
    prisme.style.transform = `rotateY(${angle}deg)`;

    // États des faces
    Array.from(faces).forEach((f, idx) => {
      f.classList.toggle('active', idx === current);
      f.classList.toggle('prev', idx === (current - 1 + faces.length) % faces.length);
      f.classList.toggle('next', idx === (current + 1) % faces.length);
    });
    Array.from(dots).forEach((d, idx) => d.classList.toggle('active', idx === current));
  }

  // Navigation points
  Array.from(dots).forEach((d, i) => d.addEventListener('click', () => goTo(i)));

  // Clavier
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') goTo(current - 1);
    else if (e.key === 'ArrowRight') goTo(current + 1);
    else if (e.key === 'ArrowUp') goTo(current - 1);
    else if (e.key === 'ArrowDown') goTo(current + 1);
  });

  // Flèches UI (4 directions)
  const arrowsEl = document.getElementById('arrows');
  if (arrowsEl) {
    arrowsEl.querySelector('.arrow-left').addEventListener('click', () => goTo(current - 1));
    arrowsEl.querySelector('.arrow-right').addEventListener('click', () => goTo(current + 1));
    arrowsEl.querySelector('.arrow-up').addEventListener('click', () => goTo(current - 1));
    arrowsEl.querySelector('.arrow-down').addEventListener('click', () => goTo(current + 1));
  }

  // Touch drag sur la vitrine
  gesture.addEventListener('pointerdown', e => {
    isDragging = true;
    startX = e.clientX;
    currentAngle = -current * (360 / faces.length);
    prisme.style.transition = 'none';
    gesture.setPointerCapture(e.pointerId);
  });

  gesture.addEventListener('pointermove', e => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const angle = currentAngle + dx * 0.5;
    prisme.style.transform = `rotateY(${angle}deg)`;
  });

  gesture.addEventListener('pointerup', e => {
    if (!isDragging) return;
    isDragging = false;
    const dx = e.clientX - startX;
    const threshold = 60;
    if (Math.abs(dx) > threshold) {
      goTo(current + (dx > 0 ? -1 : 1));
    } else {
      goTo(current); // snap back
    }
    gesture.releasePointerCapture(e.pointerId);
  });
  gesture.addEventListener('pointercancel', () => { isDragging = false; goTo(current); });

  // Particules atmosphériques
  const particulesEl = document.getElementById('particules');
  const colors = ['#1e6bff','#ff3d9a','#ffd23f','#27d17f','#8a4dff'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particule';
    const sx = (Math.random() - .5) * window.innerWidth * .8;
    const sy = (Math.random() - .5) * window.innerHeight * .8;
    const ex = (Math.random() - .5) * window.innerWidth * .8;
    const ey = (Math.random() - .5) * window.innerHeight * .8;
    const delay = Math.random() * 12;
    const dur = 10 + Math.random() * 8;
    const op = .15 + Math.random() * .25;
    const clr = colors[Math.floor(Math.random() * colors.length)];
    p.style.cssText = `
      left:50%;top:50%;
      --sx:${sx}px;--sy:${sy}px;--ex:${ex}px;--ey:${ey}px;
      --op:${op};
      background:${clr};
      animation-duration:${dur}s;animation-delay:${delay}s;
    `;
    particulesEl.appendChild(p);
  }

  // Resize handler
  new ResizeObserver(() => goTo(current, false)).observe(document.querySelector('.vitrine'));
})();
</script>
</body>
</html>
