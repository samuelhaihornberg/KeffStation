<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070816">
<meta name="description" content="KeffStation — Portail Kifftech, Tricktrocjob, ViArtificial labs">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='65' font-size='60' text-anchor='middle'%3E🔮%3C/text%3E%3C/svg%3E">
<title>KeffStation</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#070816;color:#f4f6ff;font:16px/1.5 system-ui,sans-serif}
#app{display:grid;place-items:center;height:100vh;padding:1rem}
.card{width:min(90vw,400px);background:#0d1026;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:1.5rem;text-align:center;box-shadow:0 20px 60px -20px rgba(0,0,0,.8)}
h1{font-size:1.8rem;background:linear-gradient(90deg,#1e6bff,#ff3d9a,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:.5rem}
p{color:#b9c0e6;margin-bottom:1.5rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
.btn{display:block;padding:1rem;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#f4f6ff;text-decoration:none;font-weight:600;transition:background .2s,border-color .2s,transform .1s}
.btn:hover{background:rgba(30,107,255,.2);border-color:#1e6bff;transform:translateY(-2px)}
.btn:active{transform:scale(.98)}
.btn.kifftech{border-color:#1e6bff;background:rgba(30,107,255,.15)}
.btn.tricktrocjob{border-color:#ff3d9a;background:rgba(255,61,154,.15)}
.btn.viartificial{border-color:#27d17f;background:rgba(39,209,127,.15)}
.install-btn{position:fixed;bottom:1rem;right:1rem;z-index:50;padding:.75rem 1rem;background:#ffd23f;color:#070816;border:none;border-radius:999px;font-weight:700;box-shadow:0 4px 20px rgba(255,210,63,.4);display:none}
.install-btn.show{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="card">
    <h1>KeffStation</h1>
    <p>Portail géométrique — 3 apps, 1 entrée</p>
    <div class="grid">
      <a class="btn kifftech" href="https://samuelhaihornberg.github.io/Kiff-Tech/" target="_blank" rel="noopener">Kifftech</a>
      <a class="btn tricktrocjob" href="https://samuelhaihornberg.github.io/keffjobtrictrocc/" target="_blank" rel="noopener">Tricktrocjob</a>
      <a class="btn viartificial" href="https://samuelhaihornberg.github.io/ViArtificial/" target="_blank" rel="noopener">ViArtificial labs</a>
    </div>
  </div>
</div>
<button class="install-btn" id="installBtn">📱 Installer</button>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(console.warn);
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').classList.add('show');
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') document.getElementById('installBtn').classList.remove('show');
  deferredPrompt = null;
});
</script>
</body>
</html>
