function sanitizeHTML(str){const div=document.createElement('div');div.textContent=str;return div.innerHTML;}

class KeffStation{
constructor(){this.apps=APPS;this.current=0;this.subCurrent=0;this.startX=0;this.currentAngle=0;this.isDragging=false;this.initialized=false;this.prisme=document.getElementById('prisme');this.nav=document.getElementById('nav');this.gesture=document.getElementById('gesture');this.arrows=document.getElementById('arrows');this.navEl=document.getElementById('nav');this.loading=document.getElementById('loading');const elementsFound={prisme:!!this.prisme,nav:!!this.nav,gesture:!!this.gesture,arrows:!!this.arrows,loading:!!this.loading};console.log('KeffStation constructor - Elements found:',elementsFound);const missing=Object.entries(elementsFound).filter(([_,found])=>!found).map(([name])=>name);if(missing.length>0){const msg='Missing DOM elements: '+missing.join(', ');console.error('KeffStation constructor - Missing elements:',missing);const loading=document.getElementById('loading');if(loading){loading.textContent='❌ Erreur: '+msg;loading.style.color='#ff3d9a';}throw new Error(msg);}this.faces=null;this.dots=null;this.current=0;this.subCurrent=0;this.startX=0;this.currentAngle=0;this.isDragging=false;this.initialized=false;}
async init(){try{console.log('KeffStation: Starting initialization...');console.log('KeffStation: Validating endpoints...');await this.validateEndpoints();console.log('KeffStation: Endpoints validated');console.log('KeffStation: Building UI...');this.buildUI();console.log('KeffStation: UI built');console.log('KeffStation: Setting up event listeners...');this.setupEventListeners();console.log('KeffStation: Event listeners set up');console.log('KeffStation: Initializing particles...');this.initParticles();console.log('KeffStation: Particles initialized');console.log('KeffStation: Hiding loading...');this.hideLoading();console.log('KeffStation: Loading hidden');this.initialized=true;console.log('KeffStation initialized successfully');}catch(error){console.error('Initialization failed:',error);this.showError(error?.message||error?.toString()||'Erreur inconnue');throw error;}}
async validateEndpoints(){const endpoints=this.apps.map(app=>app.appUrl).filter(Boolean);const results=await Promise.allSettled(endpoints.map(url=>fetch(url,{method:'HEAD',mode:'no-cors'}).catch(()=>true)));const failed=endpoints.filter((_,i)=>results[i].status==='rejected');if(failed.length>0){console.warn('Some endpoints unreachable (may be CORS):',failed);}}
buildUI(){this.apps.forEach((app,i)=>{const face=document.createElement('div');face.className='face'+(i===0?' active':'');face.dataset.index=i;const sub=app.subArticles[0];face.innerHTML=`<div class="num">${sanitizeHTML(app.num)}</div><h2><a href="${sanitizeHTML(app.appUrl)}" target="_blank" rel="noopener noreferrer" class="app-link">${sanitizeHTML(app.title)}</a></h2><p>${sanitizeHTML(app.desc)}</p><div class="sub-article"><h3>${sanitizeHTML(sub.title)}</h3><p>${sanitizeHTML(sub.desc)}</p><div class="tags">${sub.tags.map(t=>`<span class="tag">${sanitizeHTML(t)}</span>`).join('')}</div></div><div class="sub-nav"><span class="sub-indicator">1/${app.subArticles.length}</span></div><div class="tags">${app.tags.map(t=>`<span class="tag">${sanitizeHTML(t)}</span>`).join('')}</div>`;document.getElementById('prisme').appendChild(face);const btn=document.createElement('button');btn.type='button';btn.textContent=app.num;btn.setAttribute('aria-label',app.num);if(i===0)btn.classList.add('active');btn.addEventListener('click',()=>this.goTo(i));this.nav.appendChild(btn);});this.faces=document.getElementById('prisme').children;this.dots=this.nav.children;this.renderSubArticle();}
setupEventListeners(){Array.from(this.nav.children).forEach((btn,i)=>btn.addEventListener('click',()=>this.goTo(i)));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')this.goTo(this.current-1);else if(e.key==='ArrowRight')this.goTo(this.current+1);else if(e.key==='ArrowUp')this.goSub(-1);else if(e.key==='ArrowDown')this.goSub(1);});const arrows=document.getElementById('arrows');if(arrows){arrows.querySelector('.arrow-left')?.addEventListener('click',()=>this.goTo(this.current-1));arrows.querySelector('.arrow-right')?.addEventListener('click',()=>this.goTo(this.current+1));arrows.querySelector('.arrow-up')?.addEventListener('click',()=>this.goSub(-1));arrows.querySelector('.arrow-down')?.addEventListener('click',()=>this.goSub(1));}const gesture=document.getElementById('gesture');if(gesture){gesture.addEventListener('pointerdown',e=>this.onDragStart(e));gesture.addEventListener('pointermove',e=>this.onDragMove(e));gesture.addEventListener('pointerup',e=>this.onDragEnd(e));gesture.addEventListener('pointercancel',()=>this.onDragEnd(null));gesture.addEventListener('touchstart',e=>this.onDragStart(e),{passive:true});gesture.addEventListener('touchmove',e=>this.onDragMove(e),{passive:true});gesture.addEventListener('touchend',e=>this.onDragEnd(e));gesture.addEventListener('touchcancel',()=>this.onDragEnd(null));}this.nav.querySelectorAll('button').forEach((btn,i)=>btn.addEventListener('click',()=>this.goTo(i)));const arrowsEl=document.getElementById('arrows');if(arrowsEl){arrowsEl.querySelector('.arrow-left')?.addEventListener('click',()=>this.goTo(this.current-1));arrowsEl.querySelector('.arrow-right')?.addEventListener('click',()=>this.goTo(this.current+1));arrowsEl.querySelector('.arrow-up')?.addEventListener('click',()=>this.goSub(-1));arrowsEl.querySelector('.arrow-down')?.addEventListener('click',()=>this.goSub(1));}}
goTo(i,animate=true){if(!this.faces||!this.faces.length)return;if(i<0)i=this.faces.length-1;if(i>=this.faces.length)i=0;if(i===this.current)return;this.current=i;this.subCurrent=0;const angle=-this.current*120;this.prisme.style.transition=animate?'transform .7s cubic-bezier(.2,.8,.2,1)':'none';this.prisme.style.transform=`rotateY(${angle}deg)`;Array.from(this.faces).forEach((f,idx)=>f.classList.toggle('active',idx===this.current));Array.from(this.nav.children).forEach((d,idx)=>d.classList.toggle('active',idx===this.current));document.getElementById('arrows')?.setAttribute('data-face',this.current);document.getElementById('nav')?.setAttribute('data-face',this.current);this.subCurrent=0;this.renderSubArticle();}
goSub(delta){const app=APPS[this.current];if(!app)return;const max=app.subArticles.length-1;this.subCurrent=Math.max(0,Math.min(max,this.subCurrent+delta));this.renderSubArticle();}
renderSubArticle(){const app=APPS[this.current];if(!app)return;const sub=app.subArticles[this.subCurrent];const face=this.faces[this.current];if(!face)return;const subEl=face.querySelector('.sub-article');const indicator=face.querySelector('.sub-indicator');if(subEl&&sub){subEl.innerHTML=`<h3>${sanitizeHTML(sub.title)}</h3><p>${sanitizeHTML(sub.desc)}</p><div class="tags">${sub.tags.map(t=>`<span class="tag">${sanitizeHTML(t)}</span>`).join('')}</div>`;}if(indicator){indicator.textContent=`${this.subCurrent+1}/${app.subArticles.length}`;}Array.from(this.nav.children).forEach((d,idx)=>d.classList.toggle('active',idx===this.current));}
goSub(delta){const app=APPS[this.current];if(!app)return;const max=app.subArticles.length-1;this.subCurrent=Math.max(0,Math.min(max,this.subCurrent+delta));this.renderSubArticle();}
onDragStart(e){this.isDragging=true;this.startX=e.clientX??e.touches?.[0]?.clientX??0;this.currentAngle=-this.current*120;this.prisme.style.transition='none';if(e.target?.setPointerCapture)e.target.setPointerCapture(e.pointerId);}
onDragMove(e){if(!this.isDragging)return;const dx=(e.clientX??e.touches?.[0]?.clientX??0)-this.startX;const angle=this.currentAngle+dx*0.5;this.prisme.style.transform=`rotateY(${angle}deg)`;}
onDragEnd(e){if(!this.isDragging)return;this.isDragging=false;const dx=(e.clientX??e.changedTouches?.[0]?.clientX??0)-this.startX;const threshold=60;if(Math.abs(dx)>threshold){this.goTo(this.current+(dx>0?-1:1));}else{this.goTo(this.current);}if(e.target?.releasePointerCapture)e.target.releasePointerCapture(e.pointerId);}
initParticles(){try{const container=document.getElementById('particules');if(!container){console.warn('initParticles: particules container not found');return;}const colors=['#1e6bff','#ff3d9a','#ffd23f','#27d17f','#8a4dff'];for(let i=0;i<18;i++){const p=document.createElement('div');p.className='particule';const sx=(Math.random()-.5)*window.innerWidth*.8;const sy=(Math.random()-.5)*window.innerHeight*.8;const ex=(Math.random()-.5)*window.innerWidth*.8;const ey=(Math.random()-.5)*window.innerHeight*.8;const delay=Math.random()*12;const dur=10+Math.random()*8;const op=.15+Math.random()*.25;const clr=colors[Math.floor(Math.random()*colors.length)];p.style.cssText=`left:50%;top:50%;--sx:${sx}px;--sy:${sy}px;--ex:${ex}px;--ey:${ey}px;--op:${.15+Math.random()*.25};background:${clr};animation-duration:${10+Math.random()*8}s;animation-delay:${Math.random()*12}s`;container.appendChild(p);}}catch(e){console.error('initParticles error:',e);}}
hideLoading(){const loading=document.getElementById('loading');if(loading)loading.classList.add('hidden');}
showError(msg){const loading=document.getElementById('loading');if(loading){loading.textContent='❌ '+msg;loading.style.color='#ff3d9a';}}
}

<script>
// Force DOM ready before initialization
(function(){
  function runInit() {
    const loading = document.getElementById('loading');
    if (loading) loading.textContent = '🔄 Initialisation...';
    const timeoutId = setTimeout(() => {
      if (loading) { loading.textContent = '⚠️ Initialisation lente...'; loading.style.color = '#ffd23f'; }
    }, 5000);
    try {
      window.keffStation = new KeffStation();
      window.keffStation.init().then(() => {
        clearTimeout(timeoutId);
        const loading = document.getElementById('loading');
        if (loading) { loading.textContent = '✅ KeffStation prêt'; loading.style.color = '#27d17f'; setTimeout(() => loading.classList.add('hidden'), 1000); }
      }).catch(e => { console.error('App init failed:', e); const loading = document.getElementById('loading'); if (loading) { loading.textContent = '❌ Erreur: ' + (e?.message || e?.toString() || 'Erreur inconnue'); loading.style.color = '#ff3d9a'; } });
    } catch (e) { console.error('Constructor/InitApp sync error:', e); const loading = document.getElementById('loading'); if (loading) { loading.textContent = '❌ Erreur sync: ' + (e?.message || e?.toString() || 'Erreur inconnue'); loading.style.color = '#ff3d9a'; } }
  }
  // Ensure DOM is fully ready before initialization
  function runWhenReady() {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => { try { runInit(); } catch (e) { console.error('runInit sync error:', e); const loading = document.getElementById('loading'); if (loading) { loading.textContent = '❌ Erreur: ' + e.message; loading.style.color = '#ff3d9a'; } });
    } else if (document.readyState === 'interactive' || document.readyState === 'complete') {
      runInit();
    } else {
      document.addEventListener('DOMContentLoaded', () => { try { runInit(); } catch (e) { console.error('runInit sync error:', e); const loading = document.getElementById('loading'); if (loading) { loading.textContent = '❌ Erreur: ' + e.message; loading.style.color = '#ff3d9a'; } });
    }
  }
  runWhenReady();
})();
